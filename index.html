<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Sprocket Rocket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" class="hidden-video" playsinline muted></video>

  <main id="camera-screen" class="screen">
    <button id="open-gallery" class="thumb-btn gallery-btn" aria-label="Galerie">
      <span id="gallery-icon">▦</span><img id="last-thumb" alt="" hidden>
    </button>
    <button id="switch-camera" class="round-btn top-btn right-btn" aria-label="Přepnout kameru">⟲</button>
    <div class="viewfinder" id="viewfinder">
      <canvas id="preview"></canvas>
      <div id="flash"></div>
    </div>
    <div id="message" class="message" hidden>
      <p id="message-text"></p>
      <button id="retry" class="text-btn">Zkusit znovu</button>
    </div>
    <div class="controls" id="controls">
      <button id="orientation" class="round-btn" aria-label="Otočit film (na šířku / na výšku)">▭</button>
      <button id="shutter" aria-label="Spoušť"></button>
      <button id="zoom" class="round-btn" aria-label="Zoom">0,5×</button>
    </div>
  </main>

  <section id="gallery-screen" class="screen" hidden>
    <header class="bar"><button id="close-gallery" class="text-btn">‹ Zpět</button><span>Galerie</span></header>
    <p id="gallery-empty" class="empty" hidden>Zatím žádné snímky.</p>
    <div id="grid" class="grid"></div>
  </section>

  <section id="result" class="overlay" hidden>
    <img id="result-img" alt="Hotový snímek">
    <div class="bar">
      <button id="save" class="text-btn">Uložit / Sdílet</button>
      <button id="delete" class="text-btn" hidden>Smazat</button>
      <button id="close-result" class="text-btn">Zavřít</button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script>
    // ES moduly se z file:// nenačtou (CORS), aplikace by zůstala tiše prázdná.
    if (location.protocol === 'file:') {
      document.getElementById('message-text').textContent =
        'Stránku nelze otevřít dvojklikem na soubor. Spusť server (python3 -m http.server 8000) a otevři http://localhost:8000';
      document.getElementById('retry').hidden = true;
      document.getElementById('message').hidden = false;
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
